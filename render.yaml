# Render Blueprint for the TaskFlow API.
# In Render: New + > Blueprint > pick this repo. You'll be asked for MONGO_URI and CLIENT_URL;
# JWT_SECRET is generated for you.
services:
  - type: web
    name: taskflow-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TIMEZONE
        value: Asia/Kolkata
